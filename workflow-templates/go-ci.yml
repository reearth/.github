# Go CI: lint with golangci-lint and run tests.
# Matches the Re:Earth house setup — the Go version is read from go.mod and
# golangci-lint is pinned to v2. For a server/web monorepo (see reearth/scaffold),
# set `working-directory` and add any service containers (e.g. MongoDB) the tests need.
name: CI (Go)

on:
  push:
    branches: ["$default-branch"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.1

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - run: go test ./... -race -coverprofile=coverage.txt -covermode=atomic -timeout 10m
